<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/imagens/master-projetos.png">
  <title>Painel Master Projetos</title>
</head>
<body>

  <div id="painel">

    <header id="cabecalho">
      <div class="marca">
        <img src="/imagens/master-projetos.png" alt="Master Projetos">
      </div>

      <h1 id="tituloDaTela">Projetos B2B</h1>

      <nav id="abas" class="abas" aria-label="Telas do painel"></nav>

      <div id="periodo" class="controles-do-cabecalho" hidden>
        <label for="periodoInicio">De</label>
        <select id="periodoInicio"></select>
        <label for="periodoFim">até</label>
        <select id="periodoFim"></select>
        <button type="button" id="limparPeriodo" class="botao-limpar" hidden>limpar</button>
      </div>

      <div id="filtrosDoEstoque" class="controles-do-cabecalho" hidden>
        <label for="regionalDoEstoque">Regional</label>
        <select id="regionalDoEstoque"></select>
        <span class="rotulo-de-grupo" id="rotuloDoNivel">Nível</span>
        <div id="nivelDoEstoque" class="alternadores-de-nivel" role="group" aria-labelledby="rotuloDoNivel">
          <button type="button" data-nivel="critical" aria-pressed="false" style="--marcador: var(--status-critico)">Críticos</button>
          <button type="button" data-nivel="alert" aria-pressed="false" style="--marcador: var(--status-atencao)">Em alerta</button>
          <button type="button" data-nivel="ok" aria-pressed="false" style="--marcador: var(--serie-3)">Normais</button>
        </div>
      </div>

      <div id="prazos" class="prazos"></div>

      <div class="atualizacoes">
        <span id="atualizacaoB2b">B2B —</span>
        <span id="atualizacaoViabilidade">Viabilidade —</span>
        <span id="atualizacaoEstoque" hidden>Estoque: dados atualizados a cada 15 dias</span>
      </div>
    </header>

    <!-- ===== Tela B2B ===== -->
    <section class="tela" data-tela="b2b">
      <div id="indicadoresB2b" class="indicadores"></div>

      <div class="grade-graficos grade-b2b">
        <article class="cartao">
          <h2>Projetos por mês</h2>
          <div class="area-grafico" id="graficoProjetosPorMes"></div>
        </article>

        <article class="cartao">
          <h2>Status dos projetos</h2>
          <div class="area-grafico" id="graficoStatus"></div>
        </article>

        <article class="cartao">
          <h2 id="tituloPrioridade">Prioridade</h2>
          <div class="area-grafico" id="graficoPrioridade"></div>
        </article>

        <article class="cartao">
          <h2>Status por equipe</h2>
          <div class="area-grafico" id="graficoStatusPorEquipe"></div>
        </article>
      </div>
    </section>

    <!-- ===== Tela de estoque (fora do rodízio automático) ===== -->
    <section class="tela" data-tela="estoque" hidden>
      <div id="indicadoresEstoque" class="indicadores"></div>

      <div class="grade-graficos grade-estoque">
        <article class="cartao">
          <h2>Estoque por regional · mais graves primeiro</h2>
          <div class="corpo-de-estoque" id="tabelaDeEstoque"></div>
        </article>

        <article class="cartao">
          <h2>Por regional</h2>
          <div class="area-grafico" id="graficoEstoquePorRegional"></div>
        </article>
      </div>
    </section>

    <!-- ===== Tela B2C (viabilidade da rede) ===== -->
    <section class="tela" data-tela="b2c" hidden>
      <div id="indicadoresB2c" class="indicadores"></div>

      <div class="grade-graficos grade-b2c">
        <article class="cartao cartao-alto">
          <h2>Cidades com mais portas</h2>
          <div class="area-grafico" id="graficoCidades"></div>
        </article>

        <article class="cartao">
          <h2>Portas por regional</h2>
          <div class="area-grafico" id="graficoPortasPorRegional"></div>
        </article>

        <article class="cartao">
          <h2>Ocupação por regional</h2>
          <div class="area-grafico" id="graficoOcupacao"></div>
        </article>
      </div>
    </section>

  </div>

  <div id="detalhes" hidden></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
